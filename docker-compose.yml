version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: phd-redaction-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - phd-redaction-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phd-redaction-backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
    volumes:
      - ./backend:/app
      - /tmp/uploads:/tmp/uploads
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - phd-redaction-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phd-redaction-frontend
    ports:
      - "8099:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - phd-redaction-network

volumes:
  ollama_data:

networks:
  phd-redaction-network:
    driver: bridge
