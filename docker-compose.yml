version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phd-redaction-backend
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./backend:/app
      - /tmp/uploads:/tmp/uploads
    restart: unless-stopped
    networks:
      - phd-redaction-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phd-redaction-frontend
    ports:
      - "8099:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - phd-redaction-network

networks:
  phd-redaction-network:
    driver: bridge
